{% extends "base.html" %}

{% block title %}Kontor - Handelsimperium{% endblock %}

{% block content %}
<!-- Offline Catchup Modal Container -->
<div id="catchup-modal-container" hx-get="/resources/catchup" hx-trigger="load" hx-swap="outerHTML"></div>

<div class="space-y-6">
    <!-- Navigation Tabs -->

    <div class="flex flex-wrap items-center justify-between border-b border-slate-800 pb-3 gap-4">
        <nav class="flex space-x-2" aria-label="Tabs" id="main-tabs">
            <button id="tab-resources"
                    hx-get="/resources/overview"
                    hx-target="#main-panel"
                    hx-swap="innerHTML"
                    class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center space-x-2 bg-amber-600 text-slate-950 shadow-md">
                <span>🌾</span>
                <span>Rohstoffübersicht</span>
            </button>

            <button id="tab-market"
                    hx-get="/market/book?resource=wood"
                    hx-target="#main-panel"
                    hx-swap="innerHTML"
                    class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center space-x-2 bg-slate-900 text-slate-300 hover:bg-slate-800 hover:text-slate-100">
                <span>⚖️</span>
                <span>Markt & Orderbuch</span>
            </button>

            <button id="tab-trades"
                    hx-get="/trades/log"
                    hx-target="#main-panel"
                    hx-swap="innerHTML"
                    class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center space-x-2 bg-slate-900 text-slate-300 hover:bg-slate-800 hover:text-slate-100">
                <span>📜</span>
                <span>Handelsprotokoll</span>
            </button>

            <button id="tab-ranking"
                    hx-get="/ranking"
                    hx-target="#main-panel"
                    hx-swap="innerHTML"
                    class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center space-x-2 bg-slate-900 text-slate-300 hover:bg-slate-800 hover:text-slate-100">
                <span>🏆</span>
                <span>Rangliste</span>
            </button>

            <button id="tab-contracts"
                    hx-get="/market/contracts"
                    hx-target="#main-panel"
                    hx-swap="innerHTML"
                    class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center space-x-2 bg-slate-900 text-slate-300 hover:bg-slate-800 hover:text-slate-100">
                <span>🐫</span>
                <span>Karawanen</span>
            </button>
        </nav>

        <!-- Live Refresh Trigger -->
        <div class="flex items-center space-x-2 text-xs text-slate-400">
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>Server-Status: Synchronisiert</span>
        </div>
    </div>

    <!-- Main Dynamic HTMX Container -->
    <div id="main-panel"
         hx-get="/resources/overview"
         hx-trigger="load"
         hx-swap="innerHTML">
        <div class="p-12 text-center text-slate-500">
            <svg class="animate-spin h-6 w-6 mx-auto mb-2 text-amber-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
            Lade Kontor-Daten...
        </div>
    </div>
</div>

<script>
    // Tab styling helper
    document.addEventListener('htmx:afterOnLoad', function(evt) {
        // Highlight active tab
        const trigger = evt.detail.elt;
        if (trigger && trigger.classList.contains('tab-btn')) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = 'tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center space-x-2 bg-slate-900 text-slate-300 hover:bg-slate-800 hover:text-slate-100';
            });
            trigger.className = 'tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center space-x-2 bg-amber-600 text-slate-950 shadow-md';
        }
    });
</script>
{% endblock %}
