<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect width="496" height="496" x="8" y="8" rx="92" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.4"/>

  <!-- Merchant Scales / Cog Icon -->
  <g transform="translate(64, 64) scale(0.75)" filter="url(#glow)">
    <!-- Central Pillar -->
    <path d="M256 60 L256 420" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"/>
    <!-- Base -->
    <path d="M160 420 L352 420" stroke="url(#gold)" stroke-width="20" stroke-linecap="round"/>
    <path d="M200 400 L312 400" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
    <!-- Top Finial -->
    <circle cx="256" cy="60" r="16" fill="url(#gold)"/>
    <!-- Crossbar -->
    <path d="M100 140 Q256 120 412 140" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Left Scale (Pan & Cords) -->
    <line x1="100" y1="140" x2="60" y2="240" stroke="url(#gold)" stroke-width="6"/>
    <line x1="100" y1="140" x2="140" y2="240" stroke="url(#gold)" stroke-width="6"/>
    <path d="M40 240 Q100 290 160 240 Z" fill="url(#gold)"/>

    <!-- Right Scale (Pan & Cords) -->
    <line x1="412" y1="140" x2="372" y2="220" stroke="url(#gold)" stroke-width="6"/>
    <line x1="412" y1="140" x2="452" y2="220" stroke="url(#gold)" stroke-width="6"/>
    <path d="M352 220 Q412 270 472 220 Z" fill="url(#gold)"/>

    <!-- Golden Coins Stack -->
    <ellipse cx="256" cy="270" rx="35" ry="12" fill="url(#gold)"/>
    <ellipse cx="256" cy="295" rx="40" ry="14" fill="url(#gold)"/>
    <ellipse cx="256" cy="320" rx="45" ry="16" fill="url(#gold)"/>
  </g>
</svg>
